name: Build, test, and publish

on:
  workflow_dispatch:
  schedule:
    # Check the lightweight TF2 compatibility version hourly.
    - cron: "23 * * * *"
    # Rebuild daily to catch content-only Steam depot changes.
    - cron: "41 3 * * *"
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - main

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  update:
    name: Check for a TF2 update
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      build: ${{ steps.update.outputs.build }}
      tf2_version: ${{ steps.update.outputs.tf2_version }}

    steps:
      - name: Set up Docker Buildx
        if: github.event_name == 'schedule'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'schedule'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare TF2 server versions
        id: update
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          ROOT_IMAGE: ghcr.io/${{ github.repository }}:nightly
          I386_IMAGE: ghcr.io/${{ github.repository }}/i386:nightly
          AMD64_IMAGE: ghcr.io/${{ github.repository }}/amd64:nightly
        run: |
          set -Eeuo pipefail

          api_response=""
          tf2_version=""
          if api_response="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --retry-max-time 120 \
              --get 'https://api.steampowered.com/ISteamApps/UpToDateCheck/v1/' \
              --data-urlencode appid=440 \
              --data-urlencode version=0
          )"; then
            tf2_version="$(
              jq -er '
                .response
                | select(.success == true and .up_to_date == false)
                | .required_version
                | select(
                    type == "number"
                    and . == floor
                    and . >= 1
                    and . <= 4294967295
                  )
                | tostring
              ' <<<"${api_response}" 2>/dev/null || true
            )"
          fi

          if [[ ! "${tf2_version}" =~ ^[1-9][0-9]*$ ]]; then
            if [ "${EVENT_NAME}" != pull_request ]; then
              echo "Unable to determine the current TF2 server version" >&2
              exit 1
            fi

            echo "::warning::Unable to determine the current TF2 server version; labeling this development build as unknown"
            tf2_version=unknown
          fi

          build=true
          root_version=not-checked
          i386_version=not-checked
          amd64_version=not-checked

          if [ "${EVENT_NAME}" = schedule ]; then
            image_version() {
              docker buildx imagetools inspect "$1" \
                --format '{{json .Image.Config.Labels}}' 2>/dev/null \
                | jq -r '."tf2.server.version" // empty'
            }

            normalize_version() {
              if [[ "${1:-}" =~ ^[1-9][0-9]*$ ]]; then
                printf '%s\n' "$1"
              elif [ -n "${1:-}" ]; then
                printf '%s\n' invalid
              else
                printf '%s\n' missing
              fi
            }

            root_version="$(normalize_version "$(image_version "${ROOT_IMAGE}" || true)")"
            i386_version="$(normalize_version "$(image_version "${I386_IMAGE}" || true)")"
            amd64_version="$(normalize_version "$(image_version "${AMD64_IMAGE}" || true)")"

            if [ "${EVENT_SCHEDULE}" != '41 3 * * *' ] \
              && [ "${root_version}" = "${tf2_version}" ] \
              && [ "${i386_version}" = "${tf2_version}" ] \
              && [ "${amd64_version}" = "${tf2_version}" ]; then
              build=false
            fi
          fi

          {
            echo "### TF2 server update check"
            echo
            echo "| Source | Version |"
            echo "| --- | --- |"
            echo "| Valve | \`${tf2_version}\` |"
            echo "| Published root image | \`${root_version}\` |"
            echo "| Published i386 image | \`${i386_version}\` |"
            echo "| Published amd64 image | \`${amd64_version}\` |"
            echo
            if [ "${EVENT_SCHEDULE}" = '41 3 * * *' ]; then
              echo "Daily unconditional refresh: **true**"
              echo
            fi
            echo "Build required: **${build}**"
          } >>"${GITHUB_STEP_SUMMARY}"

          echo "build=${build}" >>"${GITHUB_OUTPUT}"
          echo "tf2_version=${tf2_version}" >>"${GITHUB_OUTPUT}"

  image:
    needs: update
    if: needs.update.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TF2_SERVER_VERSION: ${{ needs.update.outputs.tf2_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Validate repository
        run: tests/validate.sh

      - name: Generate 32-bit image metadata
        id: meta_i386
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/${{ github.repository }}/i386
          tags: |
            type=sha,format=long,enable=${{ github.event_name != 'schedule' }}
            type=raw,value=nightly,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Generate 64-bit image metadata
        id: meta_amd64
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/amd64
          tags: |
            type=sha,format=long,enable=${{ github.event_name != 'schedule' }}
            type=raw,value=nightly,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build 32-bit image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta_i386.outputs.bake-file-labels }}
          targets: image
          load: true
          set: |
            image.tags=tf2-summon:test

      - name: Test 32-bit image contract
        env:
          SUMMON_EXACT: "1"
        run: tests/contract.sh tf2-summon:test i386

      - name: Build 64-bit image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta_amd64.outputs.bake-file-labels }}
          targets: image-amd64
          load: true
          set: |
            image-amd64.tags=tf2-summon:amd64-test

      - name: Test 64-bit image contract
        env:
          SUMMON_EXACT: "1"
        run: tests/contract.sh tf2-summon:amd64-test amd64

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tags
        if: github.event_name != 'pull_request'
        env:
          I386_IMAGE_TAGS: ${{ steps.meta_i386.outputs.tags }}
          AMD64_IMAGE_TAGS: ${{ steps.meta_amd64.outputs.tags }}
        run: |
          publish_tags() {
            local source_image="$1"
            local image_tags="$2"
            while IFS= read -r tag; do
              test -n "${tag}" || continue
              docker tag "${source_image}" "${tag}"
              docker push "${tag}"
            done <<<"${image_tags}"
          }

          publish_tags tf2-summon:test "${I386_IMAGE_TAGS}"
          publish_tags tf2-summon:amd64-test "${AMD64_IMAGE_TAGS}"
