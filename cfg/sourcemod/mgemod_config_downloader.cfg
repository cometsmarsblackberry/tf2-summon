// ConVars for plugin "mge_config_downloader.smx"

// Sync stays off so that the image's pinned MGEMod configs are used. With sync
// on, every map start replaces a config that differs from MGEMod's master
// branch and reloads the map.

// Enable automatic downloading of missing MGE map configs.
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
mgemod_autodownload_enabled "1"

// On each map start, compare the local config against GitHub and replace it if they differ.
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
mgemod_autodownload_sync "0"

// URL template used to download configs. %s is replaced with the map name.
// -
// Default: "https://raw.githubusercontent.com/mgetf/MGEMod/refs/heads/master/addons/sourcemod/configs/mge/%s.cfg"
mgemod_autodownload_url "https://raw.githubusercontent.com/mgetf/MGEMod/refs/heads/master/addons/sourcemod/configs/mge/%s.cfg"

// Print download status messages to all players in chat.
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
mgemod_autodownload_notify "1"
