// sigsegv Optimize-Only convars for Summon: competitive 6v6 and Highlander
// with SourceTV on 2-vCPU cloud VMs. The extension reads this file once when
// it loads.

sig_cvar_autosave "0"

// Snapshot packing and encoding, the main CPU saving. The extension adds one
// coordinator thread to these packing workers, so one worker keeps the
// networking threads within two vCPUs.
sig_perf_sendprop_optimize "1"
sig_network_threads "1"

// CPU-only optimizations that do not change gameplay.
sig_perf_virtual_call_optimize "1"
sig_perf_virtual_call_optimize_inline_virtuals "0"
sig_perf_attributes_optimize "1"
sig_perf_input_optimize "1"
sig_perf_smokestack_fs_thrash "1"

// Off: culls lag-compensation targets for hitscan, flamethrower, and medigun,
// and rate-limits pain voice lines.
sig_perf_func_optimize "0"

// Off: prunes the SourceTV delay buffer while nobody watches, and records
// demos at a lower snapshot rate between rounds.
sig_perf_hltv_optimize "0"
sig_perf_hltv_rate_between_rounds "66"

// Off: only acts while the server hibernates, which costs nothing on a
// reservation VM.
sig_perf_idle_optimize "0"

// Off: its lowercase-only fallback breaks case-insensitive lookups of files
// with capital letters, such as exec af_hl_koth for af_HL_koth.cfg.
sig_perf_filesystem_optimize "0"

// Off: Mann vs. Machine only.
sig_perf_flame_breakable_collision "0"
sig_perf_medigun_shield_damage_events "0"
sig_perf_medigun_shield_damage_interval "0"
sig_perf_mvm_load_popfile "0"
sig_perf_squad_escort_optimize "0"

sig_etc_sendprop_override_extension "0"
